
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hospital Management System</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #eef2ff);
        }

        .container {
            width: 100%;
            max-width: 760px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 35px #1e293b20;
        }

        h1 { color: #0f766e; }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .option {
            padding: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .option h2 { color: #0f766e; }

        .option p {
            min-height: 45px;
            color: #64748b;
        }

        a {
            display: block;
            margin-top: 18px;
            padding: 13px;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover { background: #115e59; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Smart Hospital</h1>
        <p class="subtitle">
            Hospital Resource and Process Management System<br>
            Choose how you want to continue.
        </p>

        <div class="options">
            <section class="option">
                <h2>Admin</h2>
                <p>Manage doctors, wards, rooms, patients and appointments.</p>
                <a href="/admin-login">Admin Login</a>
            </section>

            <section class="option">
                <h2>Patient / User</h2>
                <p>Create an account, log in and access hospital services.</p>
                <a href="/user">User Login / Sign Up</a>
            </section>
        </div>
    </main>
</body>
</html>
